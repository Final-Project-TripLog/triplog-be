jwt.secret=vmfhaltmskdlstkfkdgodyroqkfwkdbalroqkfwkdbalaaaaaaaaaaaaaaaabbbbc
jwt.token-validity-in-seconds=36000

# MyBatis ??
mybatis.mapper-locations=classpath:mappers/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-aliases-package=com.ssafy.triplog.user.dto,com.ssafy.triplog.attraction.dto

# ?? ??? ??
spring.servlet.multipart.enabled=true
spring.servlet.multipart.location=${user.home}/triplog/uploads
spring.servlet.multipart.file-size-threshold=10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ?? ??? ??
spring.web.resources.static-locations=classpath:/static/,file:${user.home}/triplog/uploads/

# Elasticsearch ??
elasticsearch.host=localhost
elasticsearch.port=9200
elasticsearch.scheme=http

# Jackson ?? ?? - LocalDateTime ??? ??
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.write-date-timestamps-as-nanoseconds=false
spring.jackson.deserialization.read-date-timestamps-as-nanoseconds=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss