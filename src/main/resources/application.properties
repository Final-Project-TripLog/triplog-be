spring.application.name=triplog

server.servlet.context-path=/triplog
server.port=8080

logging.level.com.ssafy.triplog=trace
logging.level.org.springframework=warn
logging.pattern.console=%d{HH:mm:ss} [%level] %c{36} %m%n

# swagger ?? ??
# API ?? ???? (??)
springdoc.api-docs.path=/api-docs
# Swagger ?? ?? ?? ??
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.displayRequestDuration=true
# swagger setting >> Failed to start bean 'documentationPluginsBootstrapper'; error
spring.mvc.pathmatch.matching-strategy = ANT_PATH_MATCHER

# JWT ?? ??? ??
springdoc.swagger-ui.display-operation-id=true
springdoc.default-consumes-media-type=application/json
springdoc.default-produces-media-type=application/json
springdoc.disable-i18n=true

# ?????? ??
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3307/triplog?useSSL=false&useUnicode=true&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
spring.datasource.username=ssafy
spring.datasource.password=ssafy

